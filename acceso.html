<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Acceso de clientes a las aplicaciones de LVA Índices.">
    <meta name="robots" content="noindex">
    <title>Acceso clientes — LVA Índices</title>
    <link rel="icon" type="image/svg+xml" href="assets/iso_lva.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="assets/brand/tokens.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Misma pieza que el bloque superior de la portada: nav, lavado radial y
     canvas. Misma altura y proporción que en la portada. -->
<div class="top top--plain">

    <!-- Solo el logo: esta pantalla no lleva navegación. El JS del menú
         sale solo si no encuentra el toggle, así que no hace falta tocarlo. -->
    <nav class="nav" aria-label="Principal">
        <a class="nav__brand" href="index.html" aria-label="LVA Índices — inicio">
            <img class="nav__logo" src="assets/brand/logos/lva-logo-color-on-dark.svg" alt="LVA Índices">
        </a>
    </nav>

    <section class="hero hero--access">
        <canvas class="hero__canvas" data-field="hero" data-soft aria-hidden="true"></canvas>

        <div class="hero__inner wrap">
            <div class="access">
                <h1 class="access__title">Bienvenido.</h1>
                <p class="access__lead">Ingresa tus datos y accede a tus aplicaciones LVA.</p>

                <form class="access__form" id="form-acceso" novalidate>
                    <div class="field">
                        <label class="field__label" for="email">Correo electrónico</label>
                        <input class="field__input" type="email" id="email" name="email"
                               autocomplete="username" inputmode="email"
                               placeholder="tunombre@empresa.com" required>
                    </div>

                    <div class="field">
                        <label class="field__label" for="clave">Contraseña</label>
                        <input class="field__input" type="password" id="clave" name="clave"
                               autocomplete="current-password" required>
                    </div>

                    <div class="access__row">
                        <label class="check">
                            <input type="checkbox" name="recordar" value="1">
                            <span>Recuérdame en este equipo</span>
                        </label>
                        <a class="access__forgot" href="#recuperar">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" class="btn-acceso">Ingresar</button>

                    <p class="access__msg" id="acceso-msg" role="status" aria-live="polite"></p>
                </form>

                <p class="access__help">¿Aún no tienes cuenta?
                    <a href="mailto:comercial@lvaindices.com?subject=Solicitud%20de%20acceso">Escríbenos</a>
                    y te contactamos.</p>
            </div>
        </div>
    </section>
</div>

<script src="assets/brand/field.js"></script>
<script>
    /* La autenticación todavía no está conectada. Se intercepta el envío para
       que la contraseña no viaje a ninguna parte mientras esto sea una
       maqueta: sin esto, el navegador la mandaría al propio servidor. */
    document.getElementById('form-acceso').addEventListener('submit', function (e) {
        e.preventDefault();
        document.getElementById('acceso-msg').textContent =
            'Pantalla de diseño: falta conectar la autenticación.';
    });
</script>

</body>
</html>
