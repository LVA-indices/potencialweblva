<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Textos del sitio — LVA Índices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --navy:#0B1E2F; --navy-mid:#173A50; --linea:#23404F;
    --texto:#C4D2DA; --tenue:#7B939F; --claro:#E8F6FA;
    --turquesa:#2FC3E3; --oro:#FFD816; --alerta:#FF8B7A;
  }
  *{box-sizing:border-box}
  body{margin:0;padding-top:54px;background:var(--navy);color:var(--texto);
       font-family:'Google Sans','Google Sans Text','DM Sans',system-ui,sans-serif;
       font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}

  .adm{position:fixed;top:0;left:0;right:0;z-index:200;height:54px;display:flex;
       align-items:center;gap:10px;padding:0 18px;background:#08161f;
       border-bottom:1px solid var(--linea)}
  .adm__marca{font-size:13px;font-weight:700;color:#fff;margin-right:auto;white-space:nowrap}
  .adm__marca em{font-style:normal;font-weight:400;color:var(--tenue);margin-left:10px}
  .adm button{font:inherit;font-size:13px;font-weight:600;padding:8px 14px;border:0;
              border-radius:8px;background:rgba(255,255,255,.10);color:#fff;cursor:pointer}
  .adm button:hover{background:rgba(255,255,255,.18)}
  .adm button.pri{background:var(--oro);color:var(--navy)}
  .adm button.pri:hover{background:#F0C400}
  .adm button:disabled{opacity:.4;cursor:default}
  .adm__cuenta{font-size:12.5px;color:var(--turquesa);white-space:nowrap}

  .paginas{display:flex;gap:4px;padding:16px 18px 0;flex-wrap:wrap}
  .paginas button{font:inherit;font-size:13px;padding:7px 13px;border:1px solid var(--linea);
                  border-radius:999px;background:transparent;color:var(--tenue);cursor:pointer}
  .paginas button[aria-selected="true"]{background:var(--turquesa);border-color:var(--turquesa);color:var(--navy);font-weight:600}
  .paginas button.tocada::after{content:" •";color:var(--oro)}

  main{max-width:860px;margin:0 auto;padding:22px 18px 90px}
  .grupo{margin-top:26px}
  .grupo__titulo{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
                 color:var(--turquesa);padding-bottom:8px;border-bottom:1px solid var(--linea)}
  .campo{padding:14px 0;border-bottom:1px solid rgba(35,64,79,.5)}
  .campo__et{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--tenue);margin-bottom:7px}
  .campo__tipo{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.06em;
               text-transform:uppercase;padding:2px 6px;border-radius:4px;background:rgba(255,255,255,.07)}
  .campo__formato{color:var(--oro);font-size:11px}
  .campo textarea{width:100%;font:inherit;font-size:15px;line-height:1.55;color:var(--claro);
                  background:rgba(255,255,255,.04);border:1px solid var(--linea);border-radius:8px;
                  padding:10px 12px;resize:vertical;min-height:44px}
  .campo textarea:focus{outline:none;border-color:var(--turquesa);background:rgba(47,195,227,.07)}
  .campo.cambiado textarea{border-color:var(--oro)}
  .campo.cambiado .campo__et::before{content:"editado";color:var(--oro);font-weight:600}
  .campo--codigo textarea{font-family:ui-monospace,monospace;font-size:13px}

  .aviso{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);
         background:#08161f;border:1px solid var(--linea);border-radius:10px;padding:11px 18px;
         font-size:13.5px;color:var(--claro);opacity:0;transition:.2s;pointer-events:none;z-index:300;
         max-width:min(680px,90vw)}
  .aviso.ver{opacity:1;transform:translateX(-50%)}
  .cargando{padding:40px 18px;color:var(--tenue)}
  .intro{max-width:860px;margin:0 auto;padding:18px 18px 0;color:var(--tenue);font-size:13.5px}
  .intro b{color:var(--claro)}
</style>
</head>
<body>

<div class="adm">
  <span class="adm__marca">Textos del sitio<em id="ruta"></em></span>
  <span class="adm__cuenta" id="cuenta"></span>
  <button type="button" id="bDeshacer" disabled>Deshacer todo</button>
  <button type="button" class="pri" id="bDescargar" disabled>Descargar página</button>
</div>

<p class="intro">Edita el texto y descarga la página. El archivo descargado <b>reemplaza al del mismo nombre</b> en el sitio.
Solo cambia el texto: el diseño y el código quedan intactos.</p>

<div class="paginas" id="paginas"></div>
<main id="lista"><p class="cargando">Cargando…</p></main>
<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<script src="textos.js?v=3"></script>
</body>
</html>
